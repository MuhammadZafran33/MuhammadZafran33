<svg width="100%" height="900" viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <style>
      /* MASTER ANIMATIONS */
      @keyframes titleFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-30px); }
      }
      
      @keyframes titleGlow {
        0%, 100% { 
          filter: drop-shadow(0 0 20px rgba(0, 217, 255, 0.6)) 
                  drop-shadow(0 0 40px rgba(0, 217, 255, 0.3));
          text-shadow: 0 0 20px rgba(0, 217, 255, 0.8);
        }
        50% { 
          filter: drop-shadow(0 0 40px rgba(0, 217, 255, 1)) 
                  drop-shadow(0 0 80px rgba(255, 190, 11, 0.5));
          text-shadow: 0 0 40px rgba(255, 190, 11, 1);
        }
      }
      
      @keyframes subtitleSlide {
        0% { opacity: 0; transform: translateX(-50px); }
        100% { opacity: 1; transform: translateX(0); }
      }
      
      @keyframes pulseOrb {
        0%, 100% { r: 120; opacity: 0.6; filter: blur(20px); }
        50% { r: 180; opacity: 0.2; filter: blur(10px); }
      }
      
      @keyframes floatOrb1 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        33% { transform: translate(40px, -50px) scale(1.1); }
        66% { transform: translate(-30px, 40px) scale(0.95); }
      }
      
      @keyframes floatOrb2 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        33% { transform: translate(-50px, 30px) scale(0.95); }
        66% { transform: translate(30px, -40px) scale(1.1); }
      }
      
      @keyframes floatOrb3 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        33% { transform: translate(30px, 50px) scale(1.05); }
        66% { transform: translate(-40px, -30px) scale(0.9); }
      }
      
      @keyframes statsCountUp {
        0% { opacity: 0; transform: scale(0.5); }
        100% { opacity: 1; transform: scale(1); }
      }
      
      @keyframes badgePulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(0, 217, 255, 0.3)); }
        50% { transform: scale(1.05); filter: drop-shadow(0 0 15px rgba(0, 217, 255, 0.8)); }
      }
      
      @keyframes lineExpand {
        0% { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: 0; }
      }
      
      @keyframes shimmerWave {
        0% { 
          background-position: -1000px 0;
        }
        100% { 
          background-position: 1000px 0;
        }
      }
      
      @keyframes rotateGradient {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      @keyframes bounceIn {
        0% { opacity: 0; transform: translateY(50px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      /* TEXT STYLES */
      .main-title {
        font-family: 'Arial', sans-serif;
        font-size: 90px;
        font-weight: 900;
        text-anchor: middle;
        letter-spacing: -3px;
      }

      .subtitle {
        font-family: 'Arial', sans-serif;
        font-size: 28px;
        font-weight: 700;
        text-anchor: middle;
        letter-spacing: 2px;
      }

      .tagline {
        font-family: 'Arial', sans-serif;
        font-size: 18px;
        text-anchor: middle;
        letter-spacing: 1px;
        font-style: italic;
      }

      .stat-number {
        font-family: 'Arial', sans-serif;
        font-size: 36px;
        font-weight: 900;
        text-anchor: middle;
      }

      .stat-label {
        font-family: 'Arial', sans-serif;
        font-size: 12px;
        text-anchor: middle;
        font-weight: 700;
        letter-spacing: 1px;
      }

      .skill-badge {
        font-family: 'Arial', sans-serif;
        font-size: 13px;
        font-weight: 700;
        text-anchor: middle;
        letter-spacing: 0.5px;
      }
    </style>

    <!-- COMPLEX GRADIENTS -->
    <radialGradient id="orbGlow1" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#00d9ff;stop-opacity:0.9" />
      <stop offset="70%" style="stop-color:#00d9ff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#00d9ff;stop-opacity:0" />
    </radialGradient>

    <radialGradient id="orbGlow2" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#ffbe0b;stop-opacity:0.9" />
      <stop offset="70%" style="stop-color:#ffbe0b;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ffbe0b;stop-opacity:0" />
    </radialGradient>

    <radialGradient id="orbGlow3" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#ff006e;stop-opacity:0.9" />
      <stop offset="70%" style="stop-color:#ff006e;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ff006e;stop-opacity:0" />
    </radialGradient>

    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d9ff;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#ffbe0b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff006e;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#ffbe0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d9ff;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d9ff;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#00d9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d9ff;stop-opacity:0" />
    </linearGradient>

    <linearGradient id="badgeGrad1" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00d9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0088ff;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="badgeGrad2" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffbe0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8800;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="badgeGrad3" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff006e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc0055;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="badgeGrad4" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4ecdc4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>

    <!-- PATTERNS -->
    <pattern id="dotPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#00d9ff" opacity="0.2"/>
    </pattern>

  </defs>

  <!-- BACKGROUND LAYERS -->
  <rect width="1400" height="900" fill="#0a0e27"/>
  <rect width="1400" height="900" fill="url(#dotPattern)"/>

  <!-- ANIMATED ORB BACKGROUND (Layer 1) -->
  <circle cx="200" cy="150" r="120" fill="url(#orbGlow1)" style="animation: pulseOrb 8s ease-in-out infinite; animation-delay: 0s;"/>
  <circle cx="1200" cy="250" r="150" fill="url(#orbGlow2)" style="animation: pulseOrb 9s ease-in-out infinite; animation-delay: 1s;"/>
  <circle cx="700" cy="100" r="130" fill="url(#orbGlow3)" style="animation: pulseOrb 10s ease-in-out infinite; animation-delay: 2s;"/>
  <circle cx="1050" cy="750" r="140" fill="url(#orbGlow1)" style="animation: pulseOrb 7s ease-in-out infinite; animation-delay: 1.5s;"/>
  <circle cx="350" cy="700" r="110" fill="url(#orbGlow2)" style="animation: pulseOrb 8.5s ease-in-out infinite; animation-delay: 2.5s;"/>

  <!-- FLOATING GEOMETRIC SHAPES -->
  <g style="animation: floatOrb1 15s ease-in-out infinite;">
    <circle cx="100" cy="800" r="30" fill="none" stroke="#00d9ff" stroke-width="2" opacity="0.4"/>
    <circle cx="100" cy="800" r="50" fill="none" stroke="#00d9ff" stroke-width="1" opacity="0.2"/>
  </g>

  <g style="animation: floatOrb2 18s ease-in-out infinite;">
    <rect x="1250" y="150" width="60" height="60" fill="none" stroke="#ffbe0b" stroke-width="2" opacity="0.3" transform="rotate(45 1280 180)"/>
  </g>

  <g style="animation: floatOrb3 20s ease-in-out infinite;">
    <polygon points="300,50 330,30 360,50 340,80 310,80" fill="none" stroke="#ff006e" stroke-width="2" opacity="0.3"/>
  </g>

  <!-- TOP ACCENT LINE -->
  <line x1="0" y1="50" x2="1400" y2="50" stroke="url(#accentGradient)" stroke-width="2" opacity="0.8"
    style="animation: lineExpand 2s ease-out forwards;"/>

  <!-- ===== MAIN TITLE SECTION ===== -->
  <text x="700" y="180" class="main-title" fill="url(#titleGradient)" 
    style="animation: titleFloat 4s ease-in-out infinite, titleGlow 3s ease-in-out infinite;">
    🤖 MUHAMMAD ZAFRAN
  </text>

  <!-- SUBTITLE -->
  <text x="700" y="260" class="subtitle" fill="#00d9ff"
    style="animation: subtitleSlide 1s ease-out 0.2s both;">
    AI/ML Engineer | Data Structures Expert | Future Innovator
  </text>

  <!-- TAGLINE -->
  <text x="700" y="310" class="tagline" fill="#ffbe0b"
    style="animation: subtitleSlide 1s ease-out 0.4s both; opacity: 0; animation-fill-mode: both;">
    "Mastering Fundamentals to Build Intelligent Systems Tomorrow"
  </text>

  <!-- DIVIDER LINE WITH ANIMATION -->
  <line x1="250" y1="350" x2="1150" y2="350" stroke="url(#titleGradient)" stroke-width="3" opacity="0.7"
    style="animation: lineExpand 2s ease-out 0.6s forwards; stroke-dasharray: 900; animation-fill-mode: both;"/>

  <!-- ===== STATS SECTION ===== -->
  <!-- STAT 1: Repositories -->
  <g style="animation: bounceIn 0.8s ease-out 0.8s both;">
    <rect x="150" y="410" width="180" height="130" rx="15" fill="rgba(0, 217, 255, 0.12)" stroke="#00d9ff" stroke-width="2.5" opacity="0.9"/>
    <circle cx="240" cy="430" r="15" fill="#00d9ff" opacity="0.5"/>
    <text x="240" y="480" class="stat-number" fill="#00d9ff">22+</text>
    <text x="240" y="515" class="stat-label" fill="#b0c4de">REPOSITORIES</text>
  </g>

  <!-- STAT 2: Commits -->
  <g style="animation: bounceIn 0.8s ease-out 0.9s both;">
    <rect x="420" y="410" width="180" height="130" rx="15" fill="rgba(255, 190, 11, 0.12)" stroke="#ffbe0b" stroke-width="2.5" opacity="0.9"/>
    <circle cx="510" cy="430" r="15" fill="#ffbe0b" opacity="0.5"/>
    <text x="510" y="480" class="stat-number" fill="#ffbe0b">150+</text>
    <text x="510" y="515" class="stat-label" fill="#b0c4de">CODE COMMITS</text>
  </g>

  <!-- STAT 3: Code Lines -->
  <g style="animation: bounceIn 0.8s ease-out 1s both;">
    <rect x="690" y="410" width="180" height="130" rx="15" fill="rgba(255, 0, 110, 0.12)" stroke="#ff006e" stroke-width="2.5" opacity="0.9"/>
    <circle cx="780" cy="430" r="15" fill="#ff006e" opacity="0.5"/>
    <text x="780" y="480" class="stat-number" fill="#ff006e">2500+</text>
    <text x="780" y="515" class="stat-label" fill="#b0c4de">CODE LINES</text>
  </g>

  <!-- STAT 4: Stars -->
  <g style="animation: bounceIn 0.8s ease-out 1.1s both;">
    <rect x="960" y="410" width="180" height="130" rx="15" fill="rgba(78, 205, 196, 0.12)" stroke="#4ecdc4" stroke-width="2.5" opacity="0.9"/>
    <circle cx="1050" cy="430" r="15" fill="#4ecdc4" opacity="0.5"/>
    <text x="1050" y="480" class="stat-number" fill="#4ecdc4">25+</text>
    <text x="1050" y="515" class="stat-label" fill="#b0c4de">GITHUB STARS</text>
  </g>

  <!-- STAT 5: Followers -->
  <g style="animation: bounceIn 0.8s ease-out 1.2s both;">
    <rect x="1230" y="410" width="180" height="130" rx="15" fill="rgba(168, 85, 247, 0.12)" stroke="#a855f7" stroke-width="2.5" opacity="0.9"/>
    <circle cx="1320" cy="430" r="15" fill="#a855f7" opacity="0.5"/>
    <text x="1320" y="480" class="stat-number" fill="#a855f7">21+</text>
    <text x="1320" y="515" class="stat-label" fill="#b0c4de">FOLLOWERS</text>
  </g>

  <!-- ===== SKILLS BADGES SECTION ===== -->
  <text x="700" y="620" font-size="20" font-weight="bold" text-anchor="middle" fill="#ffbe0b"
    style="animation: subtitleSlide 1s ease-out 1.3s both;">
    💻 TOP SKILLS
  </text>

  <!-- SKILL BADGE 1: C++ -->
  <g style="animation: badgePulse 2s ease-in-out 1.4s infinite;">
    <rect x="120" y="660" width="110" height="50" rx="25" fill="url(#badgeGrad1)" opacity="0.85"/>
    <text x="175" y="693" class="skill-badge" fill="white">C++</text>
  </g>

  <!-- SKILL BADGE 2: Python -->
  <g style="animation: badgePulse 2s ease-in-out 1.5s infinite;">
    <rect x="290" y="660" width="110" height="50" rx="25" fill="url(#badgeGrad2)" opacity="0.85"/>
    <text x="345" y="693" class="skill-badge" fill="white">Python</text>
  </g>

  <!-- SKILL BADGE 3: ML -->
  <g style="animation: badgePulse 2s ease-in-out 1.6s infinite;">
    <rect x="460" y="660" width="140" height="50" rx="25" fill="url(#badgeGrad3)" opacity="0.85"/>
    <text x="530" y="693" class="skill-badge" fill="white">Machine Learning</text>
  </g>

  <!-- SKILL BADGE 4: Data Structures -->
  <g style="animation: badgePulse 2s ease-in-out 1.7s infinite;">
    <rect x="670" y="660" width="140" height="50" rx="25" fill="url(#badgeGrad1)" opacity="0.85"/>
    <text x="740" y="693" class="skill-badge" fill="white">Data Structures</text>
  </g>

  <!-- SKILL BADGE 5: Algorithms -->
  <g style="animation: badgePulse 2s ease-in-out 1.8s infinite;">
    <rect x="880" y="660" width="120" height="50" rx="25" fill="url(#badgeGrad2)" opacity="0.85"/>
    <text x="940" y="693" class="skill-badge" fill="white">Algorithms</text>
  </g>

  <!-- SKILL BADGE 6: Web Dev -->
  <g style="animation: badgePulse 2s ease-in-out 1.9s infinite;">
    <rect x="1070" y="660" width="110" height="50" rx="25" fill="url(#badgeGrad4)" opacity="0.85"/>
    <text x="1125" y="693" class="skill-badge" fill="white">Web Dev</text>
  </g>

  <!-- DIVIDER LINE -->
  <line x1="100" y1="740" x2="1300" y2="740" stroke="url(#accentGradient)" stroke-width="2" opacity="0.5"/>

  <!-- CALL TO ACTION -->
  <text x="700" y="800" font-size="20" font-weight="bold" text-anchor="middle" fill="#00d9ff"
    style="animation: titleFloat 3.5s ease-in-out 2s infinite; opacity: 0; animation-fill-mode: both;">
    📚 Explore My Work Below 👇
  </text>

  <!-- BOTTOM ACCENT STARS/PARTICLES -->
  <circle cx="150" cy="880" r="3" fill="#00d9ff" opacity="0.6" style="animation: badgePulse 1.5s ease-in-out infinite;"/>
  <circle cx="250" cy="870" r="2.5" fill="#ffbe0b" opacity="0.6" style="animation: badgePulse 1.8s ease-in-out 0.3s infinite;"/>
  <circle cx="350" cy="885" r="3" fill="#ff006e" opacity="0.6" style="animation: badgePulse 1.6s ease-in-out 0.6s infinite;"/>
  <circle cx="1050" cy="875" r="3" fill="#4ecdc4" opacity="0.6" style="animation: badgePulse 1.7s ease-in-out 0.4s infinite;"/>
  <circle cx="1150" cy="880" r="2.5" fill="#ffbe0b" opacity="0.6" style="animation: badgePulse 1.5s ease-in-out 0.2s infinite;"/>
  <circle cx="1250" cy="870" r="3" fill="#00d9ff" opacity="0.6" style="animation: badgePulse 1.8s ease-in-out 0.5s infinite;"/>

</svg>
