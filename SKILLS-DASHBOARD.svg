<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes barFill { 0% { width: 0%; } 100% { width: 100%; } }
      @keyframes glow { 0%, 100% { filter: drop-shadow(0 0 10px rgba(0, 217, 255, 0.5)); } 50% { filter: drop-shadow(0 0 25px rgba(0, 217, 255, 1)); } }
    </style>
    <linearGradient id="barGrad" x1="0%" x2="100%">
      <stop offset="0%" style="stop-color:#00d9ff" />
      <stop offset="50%" style="stop-color:#ffbe0b" />
      <stop offset="100%" style="stop-color:#ff006e" />
    </linearGradient>
  </defs>

  <rect width="1000" height="700" fill="#0a0e27"/>

  <!-- Title -->
  <text x="500" y="50" font-size="36" font-weight="bold" text-anchor="middle" fill="#00d9ff" style="animation: glow 3s infinite;">
    💻 TECHNICAL SKILLS DASHBOARD
  </text>

  <!-- Programming Languages Section -->
  <text x="50" y="120" font-size="20" font-weight="bold" fill="#ff006e">Programming Languages</text>

  <!-- C++ -->
  <text x="50" y="160" font-size="14" fill="#00d9ff">C++</text>
  <rect x="200" y="145" width="300" height="30" fill="rgba(0,217,255,0.1)" stroke="#00d9ff" stroke-width="1"/>
  <rect x="200" y="145" width="240" height="30" fill="url(#barGrad)" style="animation: barFill 1.5s ease-out;"/>
  <text x="520" y="165" font-size="12" fill="#ffbe0b">80%</text>

  <!-- Python -->
  <text x="50" y="220" font-size="14" fill="#00d9ff">Python</text>
  <rect x="200" y="205" width="300" height="30" fill="rgba(0,217,255,0.1)" stroke="#ffbe0b" stroke-width="1"/>
  <rect x="200" y="205" width="225" height="30" fill="url(#barGrad)" style="animation: barFill 1.5s ease-out 0.1s both;"/>
  <text x="520" y="225" font-size="12" fill="#ffbe0b">75%</text>

  <!-- JavaScript -->
  <text x="50" y="280" font-size="14" fill="#00d9ff">JavaScript</text>
  <rect x="200" y="265" width="300" height="30" fill="rgba(0,217,255,0.1)" stroke="#ff006e" stroke-width="1"/>
  <rect x="200" y="265" width="120" height="30" fill="url(#barGrad)" style="animation: barFill 1.5s ease-out 0.2s both;"/>
  <text x="520" y="285" font-size="12" fill="#ffbe0b">40%</text>

  <!-- CS Fundamentals Section -->
  <text x="50" y="360" font-size="20" font-weight="bold" fill="#ff006e">CS Fundamentals</text>

  <!-- Data Structures -->
  <text x="50" y="400" font-size="14" fill="#00d9ff">Data Structures</text>
  <rect x="200" y="385" width="300" height="30" fill="rgba(0,217,255,0.1)" stroke="#00d9ff" stroke-width="1"/>
  <rect x="200" y="385" width="255" height="30" fill="url(#barGrad)" style="animation: barFill 1.5s ease-out 0.3s both;"/>
  <text x="520" y="405" font-size="12" fill="#ffbe0b">85%</text>

  <!-- Algorithms -->
  <text x="50" y="460" font-size="14" fill="#00d9ff">Algorithms</text>
  <rect x="200" y="445" width="300" height="30" fill="rgba(0,217,255,0.1)" stroke="#ffbe0b" stroke-width="1"/>
  <rect x="200" y="445" width="240" height="30" fill="url(#barGrad)" style="animation: barFill 1.5s ease-out 0.4s both;"/>
  <text x="520" y="465" font-size="12" fill="#ffbe0b">80%</text>

  <!-- Operating Systems -->
  <text x="50" y="520" font-size="14" fill="#00d9ff">Operating Systems</text>
  <rect x="200" y="505" width="300" height="30" fill="rgba(0,217,255,0.1)" stroke="#ff006e" stroke-width="1"/>
  <rect x="200" y="505" width="210" height="30" fill="url(#barGrad)" style="animation: barFill 1.5s ease-out 0.5s both;"/>
  <text x="520" y="525" font-size="12" fill="#ffbe0b">70%</text>

  <!-- Mathematics Section -->
  <text x="50" y="600" font-size="20" font-weight="bold" fill="#ff006e">Mathematics</text>

  <!-- Calculus -->
  <text x="50" y="640" font-size="14" fill="#00d9ff">Calculus</text>
  <rect x="200" y="625" width="300" height="30" fill="rgba(0,217,255,0.1)" stroke="#00d9ff" stroke-width="1"/>
  <rect x="200" y="625" width="240" height="30" fill="url(#barGrad)" style="animation: barFill 1.5s ease-out 0.6s both;"/>
  <text x="520" y="645" font-size="12" fill="#ffbe0b">80%</text>
</svg>
