<svg width="100%" height="700" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <style>
      @keyframes glow {
        0%, 100% { opacity: 0.4; filter: blur(15px); }
        50% { opacity: 1; filter: blur(5px); }
      }

      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-25px); }
      }

      @keyframes pulse {
        0%, 100% { r: 100; opacity: 0.5; }
        50% { r: 150; opacity: 0.2; }
      }

      @keyframes rotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes slideInLeft {
        from { opacity: 0; transform: translateX(-50px); }
        to { opacity: 1; transform: translateX(0); }
      }

      @keyframes slideInRight {
        from { opacity: 0; transform: translateX(50px); }
        to { opacity: 1; transform: translateX(0); }
      }

      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      @keyframes shimmer {
        0% { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: 0; }
      }

      @keyframes countUp {
        0% { content: "0"; }
        100% { content: "500"; }
      }

      @keyframes colorWave {
        0% { stop-color: #00d9ff; }
        33% { stop-color: #ffbe0b; }
        66% { stop-color: #ff006e; }
        100% { stop-color: #00d9ff; }
      }
    </style>

    <!-- Multiple Gradients -->
    <radialGradient id="glow1">
      <stop offset="0%" style="stop-color:#00d9ff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#00d9ff;stop-opacity:0" />
    </radialGradient>

    <radialGradient id="glow2">
      <stop offset="0%" style="stop-color:#ff006e;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#ff006e;stop-opacity:0" />
    </radialGradient>

    <radialGradient id="glow3">
      <stop offset="0%" style="stop-color:#ffbe0b;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#ffbe0b;stop-opacity:0" />
    </radialGradient>

    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d9ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffbe0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff006e;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff006e;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="#0a0e27"/>

  <!-- Animated background particles -->
  <circle cx="100" cy="100" r="100" fill="url(#glow1)" style="animation: pulse 6s ease-in-out infinite; animation-delay: 0s;"/>
  <circle cx="1100" cy="200" r="120" fill="url(#glow2)" style="animation: pulse 7s ease-in-out infinite; animation-delay: 1s;"/>
  <circle cx="600" cy="50" r="110" fill="url(#glow3)" style="animation: pulse 8s ease-in-out infinite; animation-delay: 2s;"/>
  <circle cx="900" cy="600" r="130" fill="url(#glow1)" style="animation: pulse 9s ease-in-out infinite; animation-delay: 3s;"/>

  <!-- Decorative circles (static) -->
  <circle cx="150" cy="650" r="3" fill="#00d9ff" opacity="0.5"/>
  <circle cx="250" cy="670" r="2" fill="#ffbe0b" opacity="0.5"/>
  <circle cx="350" cy="660" r="3" fill="#ff006e" opacity="0.5"/>
  <circle cx="450" cy="675" r="2" fill="#00d9ff" opacity="0.5"/>
  <circle cx="550" cy="655" r="3" fill="#ffbe0b" opacity="0.5"/>
  <circle cx="650" cy="670" r="2" fill="#ff006e" opacity="0.5"/>
  <circle cx="750" cy="660" r="3" fill="#00d9ff" opacity="0.5"/>
  <circle cx="850" cy="675" r="2" fill="#ffbe0b" opacity="0.5"/>
  <circle cx="950" cy="655" r="3" fill="#ff006e" opacity="0.5"/>
  <circle cx="1050" cy="670" r="2" fill="#00d9ff" opacity="0.5"/>

  <!-- MAIN TITLE -->
  <text x="600" y="120" font-size="85" font-weight="900" text-anchor="middle" fill="url(#mainGradient)"
    style="animation: slideInLeft 1.2s ease-out, float 4s ease-in-out infinite 0.5s; font-family: 'Arial Black', sans-serif; letter-spacing: -3px;">
    🤖 MUHAMMAD ZAFRAN
  </text>

  <!-- SUBTITLE -->
  <text x="600" y="180" font-size="28" text-anchor="middle" fill="#00d9ff"
    style="animation: slideInRight 1.2s ease-out 0.2s both, float 3.5s ease-in-out infinite 0.8s; font-family: 'Arial', sans-serif; letter-spacing: 2px;">
    AI/ML Engineer | Data Structures Expert | Future Innovator
  </text>

  <!-- TAGLINE -->
  <text x="600" y="240" font-size="18" text-anchor="middle" fill="#b0c4de"
    style="animation: slideInLeft 1.2s ease-out 0.4s both; font-family: 'Arial', sans-serif; font-style: italic; letter-spacing: 1px;">
    "Mastering Fundamentals Today to Build Intelligent Systems Tomorrow"
  </text>

  <!-- DIVIDER LINE -->
  <line x1="250" y1="260" x2="950" y2="260" stroke="url(#accentGradient)" stroke-width="3" opacity="0.7"
    style="animation: shimmer 3s ease-in infinite;"/>

  <!-- STATS SECTION HEADER -->
  <text x="600" y="320" font-size="22" font-weight="bold" text-anchor="middle" fill="#ffbe0b"
    style="animation: slideInLeft 1.2s ease-out 0.6s both; font-family: 'Arial', sans-serif; letter-spacing: 1px;">
    📊 STATS & METRICS
  </text>

  <!-- STAT BOX 1 -->
  <g style="animation: slideInLeft 1.2s ease-out 0.7s both;">
    <rect x="150" y="360" width="220" height="120" rx="15" fill="rgba(0, 217, 255, 0.1)" stroke="#00d9ff" stroke-width="2"/>
    <text x="260" y="410" font-size="48" font-weight="900" text-anchor="middle" fill="#00d9ff">
      150+
    </text>
    <text x="260" y="450" font-size="14" font-weight="bold" text-anchor="middle" fill="#b0c4de" letter-spacing="1">
      CODE COMMITS
    </text>
  </g>

  <!-- STAT BOX 2 -->
  <g style="animation: slideInRight 1.2s ease-out 0.8s both;">
    <rect x="490" y="360" width="220" height="120" rx="15" fill="rgba(255, 190, 11, 0.1)" stroke="#ffbe0b" stroke-width="2"/>
    <text x="600" y="410" font-size="48" font-weight="900" text-anchor="middle" fill="#ffbe0b">
      6+
    </text>
    <text x="600" y="450" font-size="14" font-weight="bold" text-anchor="middle" fill="#b0c4de" letter-spacing="1">
      REPOSITORIES
    </text>
  </g>

  <!-- STAT BOX 3 -->
  <g style="animation: slideInLeft 1.2s ease-out 0.9s both;">
    <rect x="830" y="360" width="220" height="120" rx="15" fill="rgba(255, 0, 110, 0.1)" stroke="#ff006e" stroke-width="2"/>
    <text x="940" y="410" font-size="48" font-weight="900" text-anchor="middle" fill="#ff006e">
      25+
    </text>
    <text x="940" y="450" font-size="14" font-weight="bold" text-anchor="middle" fill="#b0c4de" letter-spacing="1">
      STARRED
    </text>
  </g>

  <!-- SKILLS HEADER -->
  <text x="600" y="540" font-size="22" font-weight="bold" text-anchor="middle" fill="#ffbe0b"
    style="animation: slideInRight 1.2s ease-out 1s both; font-family: 'Arial', sans-serif; letter-spacing: 1px;">
    💻 TOP SKILLS
  </text>

  <!-- SKILL BADGES -->
  <!-- Skill 1 -->
  <g style="animation: slideInLeft 1.2s ease-out 1.1s both;">
    <rect x="100" y="570" width="140" height="50" rx="10" fill="none" stroke="#00d9ff" stroke-width="2"/>
    <text x="170" y="605" font-size="14" font-weight="bold" text-anchor="middle" fill="#00d9ff">
      C++
    </text>
  </g>

  <!-- Skill 2 -->
  <g style="animation: slideInRight 1.2s ease-out 1.15s both;">
    <rect x="280" y="570" width="140" height="50" rx="10" fill="none" stroke="#ffbe0b" stroke-width="2"/>
    <text x="350" y="605" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffbe0b">
      Python
    </text>
  </g>

  <!-- Skill 3 -->
  <g style="animation: slideInLeft 1.2s ease-out 1.2s both;">
    <rect x="460" y="570" width="140" height="50" rx="10" fill="none" stroke="#ff006e" stroke-width="2"/>
    <text x="530" y="605" font-size="14" font-weight="bold" text-anchor="middle" fill="#ff006e">
      Machine Learning
    </text>
  </g>

  <!-- Skill 4 -->
  <g style="animation: slideInRight 1.2s ease-out 1.25s both;">
    <rect x="640" y="570" width="140" height="50" rx="10" fill="none" stroke="#00d9ff" stroke-width="2"/>
    <text x="710" y="605" font-size="14" font-weight="bold" text-anchor="middle" fill="#00d9ff">
      Data Structures
    </text>
  </g>

  <!-- Skill 5 -->
  <g style="animation: slideInLeft 1.2s ease-out 1.3s both;">
    <rect x="820" y="570" width="140" height="50" rx="10" fill="none" stroke="#ffbe0b" stroke-width="2"/>
    <text x="890" y="605" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffbe0b">
      Algorithms
    </text>
  </g>

  <!-- Skill 6 -->
  <g style="animation: slideInRight 1.2s ease-out 1.35s both;">
    <rect x="1000" y="570" width="140" height="50" rx="10" fill="none" stroke="#ff006e" stroke-width="2"/>
    <text x="1070" y="605" font-size="14" font-weight="bold" text-anchor="middle" fill="#ff006e">
      Web Dev
    </text>
  </g>

  <!-- BOTTOM ACCENT -->
  <line x1="200" y1="670" x2="1000" y2="670" stroke="url(#accentGradient)" stroke-width="2" opacity="0.4"/>

  <!-- CALL TO ACTION -->
  <text x="600" y="685" font-size="16" text-anchor="middle" fill="#b0c4de"
    style="animation: float 3s ease-in-out infinite 2s; font-family: 'Arial', sans-serif; letter-spacing: 1px;">
    👇 Explore My Work Below 👇
  </text>
</svg>
