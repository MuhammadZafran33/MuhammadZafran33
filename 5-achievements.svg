<svg width="100%" height="600" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes scaleUp {
        0% { transform: scale(0); }
        100% { transform: scale(1); }
      }
      @keyframes glow {
        0%, 100% { filter: drop-shadow(0 0 5px rgba(0, 217, 255, 0.3)); }
        50% { filter: drop-shadow(0 0 20px rgba(0, 217, 255, 0.8)); }
      }
    </style>
  </defs>

  <rect width="1200" height="600" fill="#0a0e27"/>

  <!-- Title -->
  <text x="600" y="60" font-size="42" font-weight="900" text-anchor="middle" fill="#00d9ff">
    🏆 KEY ACHIEVEMENTS
  </text>

  <!-- Achievement 1 -->
  <g style="animation: scaleUp 0.6s ease-out;">
    <circle cx="150" cy="200" r="50" fill="url(#achGrad1)" style="animation: glow 2s infinite;"/>
    <text x="150" y="210" font-size="32" text-anchor="middle" fill="white">15+</text>
    <text x="150" y="280" font-size="14" text-anchor="middle" fill="#00d9ff" font-weight="bold">Data Structures</text>
    <text x="150" y="300" font-size="12" text-anchor="middle" fill="#b0c4de">Implementations</text>
  </g>

  <!-- Achievement 2 -->
  <g style="animation: scaleUp 0.6s ease-out 0.1s both;">
    <circle cx="300" cy="200" r="50" fill="url(#achGrad2)" style="animation: glow 2s infinite; animation-delay: 0.3s;"/>
    <text x="300" y="210" font-size="32" text-anchor="middle" fill="white">150+</text>
    <text x="300" y="280" font-size="14" text-anchor="middle" fill="#ffbe0b" font-weight="bold">Code Commits</text>
    <text x="300" y="300" font-size="12" text-anchor="middle" fill="#b0c4de">on GitHub</text>
  </g>

  <!-- Achievement 3 -->
  <g style="animation: scaleUp 0.6s ease-out 0.2s both;">
    <circle cx="450" cy="200" r="50" fill="url(#achGrad3)" style="animation: glow 2s infinite; animation-delay: 0.6s;"/>
    <text x="450" y="210" font-size="32" text-anchor="middle" fill="white">2500+</text>
    <text x="450" y="280" font-size="14" text-anchor="middle" fill="#ff006e" font-weight="bold">Code Lines</text>
    <text x="450" y="300" font-size="12" text-anchor="middle" fill="#b0c4de">Written</text>
  </g>

  <!-- Achievement 4 -->
  <g style="animation: scaleUp 0.6s ease-out 0.3s both;">
    <circle cx="600" cy="200" r="50" fill="url(#achGrad4)" style="animation: glow 2s infinite; animation-delay: 0.9s;"/>
    <text x="600" y="210" font-size="32" text-anchor="middle" fill="white">100+</text>
    <text x="600" y="280" font-size="14" text-anchor="middle" fill="#4ecdc4" font-weight="bold">Students Helped</text>
    <text x="600" y="300" font-size="12" text-anchor="middle" fill="#b0c4de">Knowledge Shared</text>
  </g>

  <!-- Achievement 5 -->
  <g style="animation: scaleUp 0.6s ease-out 0.4s both;">
    <circle cx="750" cy="200" r="50" fill="url(#achGrad5)" style="animation: glow 2s infinite; animation-delay: 1.2s;"/>
    <text x="750" y="210" font-size="32" text-anchor="middle" fill="white">30%</text>
    <text x="750" y="280" font-size="14" text-anchor="middle" fill="#f59e0b" font-weight="bold">Optimization</text>
    <text x="750" y="300" font-size="12" text-anchor="middle" fill="#b0c4de">Performance Gain</text>
  </g>

  <!-- Achievement 6 -->
  <g style="animation: scaleUp 0.6s ease-out 0.5s both;">
    <circle cx="900" cy="200" r="50" fill="url(#achGrad6)" style="animation: glow 2s infinite; animation-delay: 1.5s;"/>
    <text x="900" y="210" font-size="32" text-anchor="middle" fill="white">8+</text>
    <text x="900" y="280" font-size="14" text-anchor="middle" fill="#06b6d4" font-weight="bold">Active Projects</text>
    <text x="900" y="300" font-size="12" text-anchor="middle" fill="#b0c4de">in Development</text>
  </g>

  <!-- Achievement 7 -->
  <g style="animation: scaleUp 0.6s ease-out 0.6s both;">
    <circle cx="1050" cy="200" r="50" fill="url(#achGrad7)" style="animation: glow 2s infinite; animation-delay: 1.8s;"/>
    <text x="1050" y="210" font-size="32" text-anchor="middle" fill="white">85%</text>
    <text x="1050" y="280" font-size="14" text-anchor="middle" fill="#ec4899" font-weight="bold">Proficiency</text>
    <text x="1050" y="300" font-size="12" text-anchor="middle" fill="#b0c4de">Data Structures</text>
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="achGrad1" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00d9ff" /><stop offset="100%" style="stop-color:#0088ff" />
    </linearGradient>
    <linearGradient id="achGrad2" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffbe0b" /><stop offset="100%" style="stop-color:#ff8800" />
    </linearGradient>
    <linearGradient id="achGrad3" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff006e" /><stop offset="100%" style="stop-color:#cc0055" />
    </linearGradient>
    <linearGradient id="achGrad4" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4ecdc4" /><stop offset="100%" style="stop-color:#10b981" />
    </linearGradient>
    <linearGradient id="achGrad5" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b" /><stop offset="100%" style="stop-color:#f97316" />
    </linearGradient>
    <linearGradient id="achGrad6" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4" /><stop offset="100%" style="stop-color:#0ea5e9" />
    </linearGradient>
    <linearGradient id="achGrad7" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899" /><stop offset="100%" style="stop-color:#db2777" />
    </linearGradient>
  </defs>

  <!-- Bottom message -->
  <text x="600" y="500" font-size="18" text-anchor="middle" fill="#ffbe0b" font-weight="bold">
    🌟 Continuous Growth & Excellence 🌟
  </text>
  <text x="600" y="535" font-size="14" text-anchor="middle" fill="#b0c4de">
    Every achievement is a stepping stone towards becoming an AI innovation leader
  </text>
</svg>
