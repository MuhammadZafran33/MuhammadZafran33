<svg width="100%" height="600" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes barFill {
        0% { width: 0%; }
        100% { width: var(--width, 100%); }
      }
      @keyframes fadeIn {
        0% { opacity: 0; transform: translateX(-20px); }
        100% { opacity: 1; transform: translateX(0); }
      }
      @keyframes glow {
        0%, 100% { filter: drop-shadow(0 0 10px rgba(0, 217, 255, 0.3)); }
        50% { filter: drop-shadow(0 0 25px rgba(0, 217, 255, 0.8)); }
      }
      .skill-label { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #00d9ff; }
      .skill-percent { font-family: Arial, sans-serif; font-size: 14px; fill: #ffbe0b; }
      .skill-bar-bg { fill: rgba(0, 217, 255, 0.1); stroke: #00d9ff; stroke-width: 2; }
      .skill-bar-fill { fill: url(#skillGradient); animation: barFill 1.5s ease-out forwards; }
      .category-title { font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #ff006e; }
    </style>
    <linearGradient id="skillGradient" x1="0%" x2="100%">
      <stop offset="0%" style="stop-color:#00d9ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffbe0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff006e;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="#0a0e27"/>

  <!-- Title -->
  <text x="600" y="50" font-size="40" font-weight="900" text-anchor="middle" fill="#00d9ff" style="animation: glow 3s infinite;">
    💻 TECHNICAL SKILLS DASHBOARD
  </text>

  <!-- Programming Languages Section -->
  <text x="50" y="120" class="category-title">Programming Languages</text>

  <!-- C++ Skill -->
  <text x="50" y="160" class="skill-label">C++</text>
  <rect x="250" y="145" width="300" height="30" rx="5" class="skill-bar-bg"/>
  <rect x="250" y="145" width="240" height="30" rx="5" class="skill-bar-fill" style="animation-delay: 0s; --width: 80%;"/>
  <text x="560" y="165" class="skill-percent">80%</text>

  <!-- Python Skill -->
  <text x="50" y="220" class="skill-label">Python</text>
  <rect x="250" y="205" width="300" height="30" rx="5" class="skill-bar-bg"/>
  <rect x="250" y="205" width="225" height="30" rx="5" class="skill-bar-fill" style="animation-delay: 0.1s; --width: 75%;"/>
  <text x="560" y="225" class="skill-percent">75%</text>

  <!-- JavaScript Skill -->
  <text x="50" y="280" class="skill-label">JavaScript</text>
  <rect x="250" y="265" width="300" height="30" rx="5" class="skill-bar-bg"/>
  <rect x="250" y="265" width="120" height="30" rx="5" class="skill-bar-fill" style="animation-delay: 0.2s; --width: 40%;"/>
  <text x="560" y="285" class="skill-percent">40%</text>

  <!-- Data Science Section -->
  <text x="50" y="360" class="category-title">Data Science & ML</text>

  <!-- NumPy/Pandas -->
  <text x="50" y="400" class="skill-label">NumPy/Pandas</text>
  <rect x="250" y="385" width="300" height="30" rx="5" class="skill-bar-bg"/>
  <rect x="250" y="385" width="210" height="30" rx="5" class="skill-bar-fill" style="animation-delay: 0.3s; --width: 70%;"/>
  <text x="560" y="405" class="skill-percent">70%</text>

  <!-- TensorFlow -->
  <text x="50" y="460" class="skill-label">TensorFlow</text>
  <rect x="250" y="445" width="300" height="30" rx="5" class="skill-bar-bg"/>
  <rect x="250" y="445" width="165" height="30" rx="5" class="skill-bar-fill" style="animation-delay: 0.4s; --width: 55%;"/>
  <text x="560" y="465" class="skill-percent">55%</text>

  <!-- CS Fundamentals Section -->
  <text x="700" y="120" class="category-title">CS Fundamentals</text>

  <!-- Data Structures -->
  <text x="700" y="160" class="skill-label">Data Structures</text>
  <rect x="900" y="145" width="300" height="30" rx="5" class="skill-bar-bg"/>
  <rect x="900" y="145" width="255" height="30" rx="5" class="skill-bar-fill" style="animation-delay: 0.5s; --width: 85%;"/>
  <text x="1210" y="165" class="skill-percent">85%</text>

  <!-- Algorithms -->
  <text x="700" y="220" class="skill-label">Algorithms</text>
  <rect x="900" y="205" width="300" height="30" rx="5" class="skill-bar-bg"/>
  <rect x="900" y="205" width="240" height="30" rx="5" class="skill-bar-fill" style="animation-delay: 0.6s; --width: 80%;"/>
  <text x="1210" y="225" class="skill-percent">80%</text>

  <!-- Operating Systems -->
  <text x="700" y="280" class="skill-label">Operating Systems</text>
  <rect x="900" y="265" width="300" height="30" rx="5" class="skill-bar-bg"/>
  <rect x="900" y="265" width="210" height="30" rx="5" class="skill-bar-fill" style="animation-delay: 0.7s; --width: 70%;"/>
  <text x="1210" y="285" class="skill-percent">70%</text>

  <!-- Mathematics -->
  <text x="700" y="360" class="category-title">Mathematics</text>

  <!-- Calculus -->
  <text x="700" y="400" class="skill-label">Calculus</text>
  <rect x="900" y="385" width="300" height="30" rx="5" class="skill-bar-bg"/>
  <rect x="900" y="385" width="240" height="30" rx="5" class="skill-bar-fill" style="animation-delay: 0.8s; --width: 80%;"/>
  <text x="1210" y="405" class="skill-percent">80%</text>

  <!-- Linear Algebra -->
  <text x="700" y="460" class="skill-label">Linear Algebra</text>
  <rect x="900" y="445" width="300" height="30" rx="5" class="skill-bar-bg"/>
  <rect x="900" y="445" width="225" height="30" rx="5" class="skill-bar-fill" style="animation-delay: 0.9s; --width: 75%;"/>
  <text x="1210" y="465" class="skill-percent">75%</text>

  <!-- Bottom accent line -->
  <line x1="50" y1="550" x2="1150" y2="550" stroke="url(#skillGradient)" stroke-width="3" opacity="0.6"/>
</svg>
