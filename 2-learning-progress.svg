<svg width="100%" height="700" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes progressFill {
        0% { width: 0%; }
        100% { width: var(--progress, 70%); }
      }
      @keyframes pulse {
        0%, 100% { r: 8; opacity: 0.8; }
        50% { r: 12; opacity: 1; }
      }
      @keyframes slideIn {
        0% { opacity: 0; transform: translateY(20px); }
        100% { opacity: 1; transform: translateY(0); }
      }
    </style>
    <linearGradient id="progressGrad" x1="0%" x2="100%">
      <stop offset="0%" style="stop-color:#00d9ff" />
      <stop offset="50%" style="stop-color:#ffbe0b" />
      <stop offset="100%" style="stop-color:#ff006e" />
    </linearGradient>
  </defs>

  <rect width="1200" height="700" fill="#0a0e27"/>

  <!-- Title -->
  <text x="600" y="60" font-size="42" font-weight="900" text-anchor="middle" fill="#00d9ff">
    📚 LEARNING PROGRESS ROADMAP
  </text>

  <!-- Timeline -->
  <line x1="100" y1="140" x2="1100" y2="140" stroke="#00d9ff" stroke-width="3" opacity="0.3"/>

  <!-- Phase 1: Foundations (2024-2025) -->
  <circle cx="200" cy="140" r="15" fill="#00d9ff" style="animation: pulse 2s infinite;"/>
  <text x="200" y="200" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffbe0b">2024-2025</text>
  <text x="200" y="225" font-size="16" text-anchor="middle" fill="#00d9ff">Foundations</text>
  <text x="200" y="250" font-size="14" text-anchor="middle" fill="#b0c4de">70% Complete</text>

  <!-- Tasks for Phase 1 -->
  <rect x="80" y="280" width="240" height="150" rx="10" fill="rgba(0, 217, 255, 0.1)" stroke="#00d9ff" stroke-width="2"/>
  <text x="200" y="305" font-size="12" text-anchor="middle" fill="#00d9ff">✅ Data Structures</text>
  <text x="200" y="325" font-size="12" text-anchor="middle" fill="#00d9ff">✅ C++ Programming</text>
  <text x="200" y="345" font-size="12" text-anchor="middle" fill="#00d9ff">✅ Algorithm Analysis</text>
  <text x="200" y="365" font-size="12" text-anchor="middle" fill="#00d9ff">🔄 Operating Systems</text>
  <text x="200" y="385" font-size="12" text-anchor="middle" fill="#00d9ff">🔄 ML Fundamentals</text>
  <text x="200" y="405" font-size="12" text-anchor="middle" fill="#00d9ff">🔄 Mathematics</text>
  <text x="200" y="425" font-size="12" text-anchor="middle" fill="#00d9ff">🔄 Digital Logic</text>

  <!-- Phase 2: Specialization (2025-2026) -->
  <circle cx="500" cy="140" r="15" fill="#ffbe0b" style="animation: pulse 2s infinite; animation-delay: 0.5s;"/>
  <text x="500" y="200" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffbe0b">2025-2026</text>
  <text x="500" y="225" font-size="16" text-anchor="middle" fill="#ffbe0b">Specialization</text>
  <text x="500" y="250" font-size="14" text-anchor="middle" fill="#b0c4de">In Planning</text>

  <!-- Tasks for Phase 2 -->
  <rect x="380" y="280" width="240" height="150" rx="10" fill="rgba(255, 190, 11, 0.1)" stroke="#ffbe0b" stroke-width="2"/>
  <text x="500" y="305" font-size="12" text-anchor="middle" fill="#ffbe0b">📋 Deep Learning</text>
  <text x="500" y="325" font-size="12" text-anchor="middle" fill="#ffbe0b">📋 Computer Vision</text>
  <text x="500" y="345" font-size="12" text-anchor="middle" fill="#ffbe0b">📋 NLP Basics</text>
  <text x="500" y="365" font-size="12" text-anchor="middle" fill="#ffbe0b">📋 Robotics Fund.</text>
  <text x="500" y="385" font-size="12" text-anchor="middle" fill="#ffbe0b">📋 Research Focus</text>
  <text x="500" y="405" font-size="12" text-anchor="middle" fill="#ffbe0b">📋 Publications</text>
  <text x="500" y="425" font-size="12" text-anchor="middle" fill="#ffbe0b">📋 Open Source</text>

  <!-- Phase 3: Research (2026-2027) -->
  <circle cx="800" cy="140" r="15" fill="#ff006e" style="animation: pulse 2s infinite; animation-delay: 1s;"/>
  <text x="800" y="200" font-size="18" font-weight="bold" text-anchor="middle" fill="#ff006e">2026-2027</text>
  <text x="800" y="225" font-size="16" text-anchor="middle" fill="#ff006e">Research</text>
  <text x="800" y="250" font-size="14" text-anchor="middle" fill="#b0c4de">Future Goal</text>

  <!-- Tasks for Phase 3 -->
  <rect x="680" y="280" width="240" height="150" rx="10" fill="rgba(255, 0, 110, 0.1)" stroke="#ff006e" stroke-width="2"/>
  <text x="800" y="305" font-size="12" text-anchor="middle" fill="#ff006e">🔬 ML Research</text>
  <text x="800" y="325" font-size="12" text-anchor="middle" fill="#ff006e">🔬 Vision Projects</text>
  <text x="800" y="345" font-size="12" text-anchor="middle" fill="#ff006e">🔬 Publications</text>
  <text x="800" y="365" font-size="12" text-anchor="middle" fill="#ff006e">🔬 OSS Leadership</text>
  <text x="800" y="385" font-size="12" text-anchor="middle" fill="#ff006e">🔬 Mentorship</text>
  <text x="800" y="405" font-size="12" text-anchor="middle" fill="#ff006e">🔬 Industry Impact</text>
  <text x="800" y="425" font-size="12" text-anchor="middle" fill="#ff006e">🔬 AI Innovation</text>

  <!-- Phase 4: Leadership (2027+) -->
  <circle cx="1100" cy="140" r="15" fill="#4ecdc4" style="animation: pulse 2s infinite; animation-delay: 1.5s;"/>
  <text x="1100" y="200" font-size="18" font-weight="bold" text-anchor="middle" fill="#4ecdc4">2027+</text>
  <text x="1100" y="225" font-size="16" text-anchor="middle" fill="#4ecdc4">Leadership</text>
  <text x="1100" y="250" font-size="14" text-anchor="middle" fill="#b0c4de">Vision Goal</text>

  <!-- Overall Progress Bar -->
  <text x="50" y="520" font-size="18" font-weight="bold" fill="#00d9ff">Overall Learning Progress</text>
  <rect x="50" y="540" width="1100" height="50" rx="25" fill="rgba(0, 217, 255, 0.1)" stroke="#00d9ff" stroke-width="2"/>
  <rect x="50" y="540" width="770" height="50" rx="25" fill="url(#progressGrad)" style="animation: progressFill 2s ease-out forwards; --progress: 70%;"/>
  <text x="600" y="575" font-size="24" font-weight="bold" text-anchor="middle" fill="#0a0e27">70% COMPLETE</text>

  <!-- Bottom stats -->
  <text x="50" y="640" font-size="14" fill="#b0c4de">✅ Completed: 7/10 modules | 🔄 In Progress: 3/10 | 📅 Upcoming: 5+ modules</text>
</svg>
