<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-15px); } }
      @keyframes glow { 0%, 100% { filter: drop-shadow(0 0 15px currentColor); } 50% { filter: drop-shadow(0 0 35px currentColor); } }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes slideIn { 0% { opacity: 0; transform: translateY(30px); } 100% { opacity: 1; transform: translateY(0); } }
    </style>
  </defs>

  <!-- Background with gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="700" fill="url(#bgGrad)"/>

  <!-- Decorative circles in background -->
  <circle cx="100" cy="100" r="80" fill="#00d9ff" opacity="0.1"/>
  <circle cx="1100" cy="600" r="120" fill="#ff006e" opacity="0.1"/>
  <circle cx="600" cy="50" r="100" fill="#ffbe0b" opacity="0.1"/>

  <!-- Main Title -->
  <text x="600" y="70" font-size="48" font-weight="900" text-anchor="middle" fill="#ffbe0b" style="animation: glow 3s infinite; letter-spacing: 2px;">
    🏆 ACHIEVEMENTS & MILESTONES 🏆
  </text>

  <!-- Divider line -->
  <line x1="150" y1="95" x2="1050" y2="95" stroke="#00d9ff" stroke-width="3" opacity="0.7"/>

  <!-- Achievement 1: Data Structures -->
  <g style="animation: slideIn 0.8s ease-out 0.1s both;">
    <rect x="50" y="140" width="220" height="200" rx="20" fill="rgba(0, 217, 255, 0.15)" stroke="#00d9ff" stroke-width="3"/>
    <circle cx="160" cy="180" r="35" fill="#00d9ff" style="animation: glow 2s infinite; color: #00d9ff;"/>
    <text x="160" y="195" font-size="32" font-weight="bold" text-anchor="middle" fill="white">15+</text>
    <text x="160" y="240" font-size="16" font-weight="bold" text-anchor="middle" fill="#00d9ff">Data</text>
    <text x="160" y="260" font-size="16" font-weight="bold" text-anchor="middle" fill="#00d9ff">Structures</text>
    <text x="160" y="320" font-size="12" text-anchor="middle" fill="#b0c4de">Expert</text>
    <text x="160" y="335" font-size="12" text-anchor="middle" fill="#b0c4de">Implementations</text>
  </g>

  <!-- Achievement 2: Code Commits -->
  <g style="animation: slideIn 0.8s ease-out 0.2s both;">
    <rect x="330" y="140" width="220" height="200" rx="20" fill="rgba(255, 190, 11, 0.15)" stroke="#ffbe0b" stroke-width="3"/>
    <circle cx="440" cy="180" r="35" fill="#ffbe0b" style="animation: glow 2s infinite 0.3s; color: #ffbe0b;"/>
    <text x="440" y="195" font-size="32" font-weight="bold" text-anchor="middle" fill="white">150+</text>
    <text x="440" y="240" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffbe0b">Code</text>
    <text x="440" y="260" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffbe0b">Commits</text>
    <text x="440" y="320" font-size="12" text-anchor="middle" fill="#b0c4de">Consistent</text>
    <text x="440" y="335" font-size="12" text-anchor="middle" fill="#b0c4de">Contribution</text>
  </g>

  <!-- Achievement 3: Code Lines -->
  <g style="animation: slideIn 0.8s ease-out 0.3s both;">
    <rect x="610" y="140" width="220" height="200" rx="20" fill="rgba(255, 0, 110, 0.15)" stroke="#ff006e" stroke-width="3"/>
    <circle cx="720" cy="180" r="35" fill="#ff006e" style="animation: glow 2s infinite 0.6s; color: #ff006e;"/>
    <text x="720" y="195" font-size="32" font-weight="bold" text-anchor="middle" fill="white">2500+</text>
    <text x="720" y="240" font-size="16" font-weight="bold" text-anchor="middle" fill="#ff006e">Lines of</text>
    <text x="720" y="260" font-size="16" font-weight="bold" text-anchor="middle" fill="#ff006e">Code</text>
    <text x="720" y="320" font-size="12" text-anchor="middle" fill="#b0c4de">Quality &</text>
    <text x="720" y="335" font-size="12" text-anchor="middle" fill="#b0c4de">Well-Documented</text>
  </g>

  <!-- Achievement 4: Students Helped -->
  <g style="animation: slideIn 0.8s ease-out 0.4s both;">
    <rect x="890" y="140" width="220" height="200" rx="20" fill="rgba(78, 205, 196, 0.15)" stroke="#4ecdc4" stroke-width="3"/>
    <circle cx="1000" cy="180" r="35" fill="#4ecdc4" style="animation: glow 2s infinite 0.9s; color: #4ecdc4;"/>
    <text x="1000" y="195" font-size="32" font-weight="bold" text-anchor="middle" fill="white">100+</text>
    <text x="1000" y="240" font-size="16" font-weight="bold" text-anchor="middle" fill="#4ecdc4">Students</text>
    <text x="1000" y="260" font-size="16" font-weight="bold" text-anchor="middle" fill="#4ecdc4">Helped</text>
    <text x="1000" y="320" font-size="12" text-anchor="middle" fill="#b0c4de">Knowledge</text>
    <text x="1000" y="335" font-size="12" text-anchor="middle" fill="#b0c4de">Sharing</text>
  </g>

  <!-- Bottom Stats Section -->
  <rect x="50" y="390" width="1100" height="280" rx="20" fill="rgba(0, 217, 255, 0.08)" stroke="#00d9ff" stroke-width="2"/>

  <!-- Stats Title -->
  <text x="600" y="430" font-size="28" font-weight="bold" text-anchor="middle" fill="#ffbe0b" style="letter-spacing: 1px;">
    📊 ADDITIONAL ACHIEVEMENTS
  </text>

  <!-- Stat Card 1 -->
  <g style="animation: slideIn 0.8s ease-out 0.5s both;">
    <rect x="80" y="470" width="240" height="160" rx="15" fill="rgba(0, 217, 255, 0.15)" stroke="#00d9ff" stroke-width="2"/>
    <text x="200" y="500" font-size="24" font-weight="bold" text-anchor="middle" fill="#00d9ff">22+</text>
    <text x="200" y="530" font-size="14" font-weight="bold" text-anchor="middle" fill="#b0c4de">Active</text>
    <text x="200" y="550" font-size="14" font-weight="bold" text-anchor="middle" fill="#b0c4de">Repositories</text>
    <text x="200" y="580" font-size="11" text-anchor="middle" fill="#ffbe0b">Diverse Projects</text>
    <text x="200" y="595" font-size="11" text-anchor="middle" fill="#ffbe0b">Across Domains</text>
  </g>

  <!-- Stat Card 2 -->
  <g style="animation: slideIn 0.8s ease-out 0.6s both;">
    <rect x="370" y="470" width="240" height="160" rx="15" fill="rgba(255, 190, 11, 0.15)" stroke="#ffbe0b" stroke-width="2"/>
    <text x="490" y="500" font-size="24" font-weight="bold" text-anchor="middle" fill="#ffbe0b">25+</text>
    <text x="490" y="530" font-size="14" font-weight="bold" text-anchor="middle" fill="#b0c4de">GitHub</text>
    <text x="490" y="550" font-size="14" font-weight="bold" text-anchor="middle" fill="#b0c4de">Stars</text>
    <text x="490" y="580" font-size="11" text-anchor="middle" fill="#00d9ff">Community</text>
    <text x="490" y="595" font-size="11" text-anchor="middle" fill="#00d9ff">Recognition</text>
  </g>

  <!-- Stat Card 3 -->
  <g style="animation: slideIn 0.8s ease-out 0.7s both;">
    <rect x="660" y="470" width="240" height="160" rx="15" fill="rgba(255, 0, 110, 0.15)" stroke="#ff006e" stroke-width="2"/>
    <text x="780" y="500" font-size="24" font-weight="bold" text-anchor="middle" fill="#ff006e">85%</text>
    <text x="780" y="530" font-size="14" font-weight="bold" text-anchor="middle" fill="#b0c4de">Data Structures</text>
    <text x="780" y="550" font-size="14" font-weight="bold" text-anchor="middle" fill="#b0c4de">Mastery</text>
    <text x="780" y="580" font-size="11" text-anchor="middle" fill="#ffbe0b">Expert Level</text>
    <text x="780" y="595" font-size="11" text-anchor="middle" fill="#ffbe0b">Knowledge</text>
  </g>

  <!-- Bottom accent -->
  <line x1="150" y1="670" x2="1050" y2="670" stroke="#00d9ff" stroke-width="2" opacity="0.5"/>
  
  <text x="600" y="695" font-size="14" text-anchor="middle" fill="#ffbe0b" style="animation: float 3s infinite; letter-spacing: 1px;">
    ✨ Excellence Through Continuous Learning & Growth ✨
  </text>
</svg>
